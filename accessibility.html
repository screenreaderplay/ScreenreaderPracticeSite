<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessibility – FlyAble Flights</title>
<link rel="stylesheet" href="styles.css">
<style>.simple { padding-block: 40px 60px; display: grid; gap: 14px; max-width: 70ch; }</style>
</head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="index.html">FlyAble Flights</a></div></header>
<main id="main" class="wrap simple">
  <h1>Accessibility</h1>
  <p>FlyAble Flights is a pretend site for practising with a screen reader. The accessible version aims to meet WCAG 2.2 AA. The inaccessible version has deliberate faults, listed on the start page.</p>
  <p><a id="back" href="index.html">Back to flights</a></p>
</main>
<script>
  // Go back to whichever version of the flights page you came from
  try { const r = document.referrer; if (/\/(custom|broken)\.html/.test(r)) document.getElementById('back').href = r.split('#')[0]; } catch (e) {}
</script>
</body>
</html>
