<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop-down test</title>
<style>body{font-family:Arial,sans-serif;font-size:1.1rem;margin:16px;line-height:1.5} label{display:block;font-weight:700;margin-top:16px} input,select,button{font:inherit;padding:8px;min-height:44px;width:100%;max-width:340px;box-sizing:border-box}</style>
</head>
<body>
<h1>Drop-down test</h1>
<p>A plain page with no scripts. Choose a cabin class and see where VoiceOver goes.</p>
<form action="#" onsubmit="return false">
<label for="t1">From</label>
<input id="t1" type="text">
<label for="t2">To</label>
<input id="t2" type="text">
<label for="cabin">Cabin class</label>
<select id="cabin">
<option>Economy</option>
<option>Premium economy</option>
<option>Business</option>
<option>First</option>
</select>
<p><button type="submit">Search flights</button></p>
</form>
</body>
</html>
